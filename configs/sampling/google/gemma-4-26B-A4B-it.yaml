# mini-swe-agent sampling for google/gemma-4-26B-A4B-it (Gemma 4 MoE 26B-A4B, thinking + tool-use).
#
# Selected automatically by harbor_eval.sh from MODEL: harbor/configs/<repo>.yaml.
# Harbor runs `mini-swe-agent --yolo -c mini -c <this file> ...`; `-c mini` is the
# base scaffold and this file recursive-merges the sampling knobs on top.
#
# SAMPLING (per request / the run owner's chosen params):
#   temperature 1.0, top_p 0.95, top_k 64.
# top_k is not an OpenAI-schema param, so it rides in extra_body (vLLM reads it there);
# drop_params keeps litellm from erroring on it for the openai provider.
# Do NOT set temperature=0 (as with Qwen, greedy stalls mini-swe's RepeatedFormatError
# loop; see memory: swebench-downstream-eval).
#
# THINKING: Gemma 4 thinking is enabled per-request via
#   extra_body={"chat_template_kwargs": {"enable_thinking": True}}
# (model card / vLLM recipe). Leave it on for SWE-bench.
#
# SERVING (harbor_eval.sbatch VLLM_EXTRA_ARGS): --tool-call-parser gemma4
# --reasoning-parser gemma4 --enable-auto-tool-choice, and a REQUIRED custom chat
# template (examples/tool_chat_template_gemma4.jinja) because Gemma 4 tool calls use
# dedicated special tokens. SWE-bench is TEXT-ONLY: --limit-mm-per-prompt '{"image":0,"audio":0}'
# caps the vision tower (do NOT use Qwen's --language-model-only). vLLM >= 0.25.0
# (repo serves vllm/vllm-openai:v0.28.0). Do NOT reuse qwen3_coder -- it drops Gemma 4
# tool calls -> zeroed eval (same trap as GLM; see memory: vllm-tool-parser-gotcha).
model:
  model_kwargs:
    temperature: 1.0
    top_p: 0.95
    drop_params: true
    extra_body:
      top_k: 64
      chat_template_kwargs:
        enable_thinking: true