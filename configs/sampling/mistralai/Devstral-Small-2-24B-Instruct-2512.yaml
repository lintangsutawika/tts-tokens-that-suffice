# mini-swe-agent sampling for mistralai/Devstral-Small-2-24B-Instruct-2512
# (self-hosted vLLM deliberator).
#
# Selected automatically by harbor_eval.sh from MODEL: harbor/configs/<repo>.yaml.
# Harbor runs `mini-swe-agent --yolo -c mini -c <this file> ...`; `-c mini` is the
# base scaffold and this file recursive-merges the sampling knobs on top.
#
# Devstral Small 2 (24B, Mistral-Small-3.1 base, FP8) is an AGENTIC CODING model,
# NOT a reasoning model -- there is no thinking/reasoning parser. The model card
# samples at temperature 0.15 (the card's client snippets use temperature 0.15;
# top_p unspecified -> 1.0). drop_params keeps litellm from erroring on any
# non-OpenAI-schema param for the openai provider.
#
# SERVING (serve/models/mistralai/Devstral-Small-2-24B-Instruct-2512.json): this
# ships BOTH HF (tokenizer.json + chat_template.jinja) and tekken.json, so it serves
# in STANDARD HF mode -- the card's vllm command does NOT pass --tokenizer-mode
# mistral (unlike the mistral-only Devstral-Small-2505). Tool calling still uses
# --tool-call-parser mistral (the Mistral tool format with [TOOL_CALLS]/
# [TOOL_RESULTS] brackets); the wrong parser silently zeroes the eval (memory:
# vllm-tool-parser-gotcha). Card serves at TP=2 with --max-model-len 262144; needs
# mistral_common >= 1.8.6 in the serve image.
model:
  model_kwargs:
    temperature: 0.15
    top_p: 1.0
    max_tokens: 32768
    drop_params: true