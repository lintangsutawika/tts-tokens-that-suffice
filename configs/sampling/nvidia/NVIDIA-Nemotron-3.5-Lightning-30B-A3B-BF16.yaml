# mini-swe-agent sampling for nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
# (Nemotron 3.5 Lightning hybrid Mamba-MoE 30B-A3B, reasoning + agent-oriented tool use).
#
# Selected automatically by harbor_eval.sh from MODEL: harbor/configs/<repo>.yaml.
# Harbor runs `mini-swe-agent --yolo -c mini -c <this file> ...`; `-c mini` is the
# base scaffold and this file recursive-merges the sampling knobs on top.
#
# SAMPLING (per the run owner / card-consistent): temperature 1.0, top_p 0.95, top_k 64.
# The model card's Recommended Sampling is Temperature 1.0, Top_p 0.95. top_k is not an
# OpenAI-schema param, so it rides in extra_body (drop_params lets litellm pass it).
# Do NOT set temperature=0 (greedy stalls mini-swe's RepeatedFormatError loop; same trap
# as Qwen, see memory: swebench-downstream-eval).
#
# THINKING: Nemotron 3.5 exposes reasoning control via chat-template kwargs; the default
# is thinking ENABLED, returned separately on message.reasoning. Keep enable_thinking true
# for SWE-bench (agent harness). NOTE: reasoning tokens count toward max_tokens.
#
# SERVING (harbor_eval.sbatch VLLM_EXTRA_ARGS): --reasoning-parser nemotron_v3 (vLLM;
# NOT nemotron_3, which is the SGLang name) --tool-call-parser qwen3_coder
# --enable-auto-tool-choice, plus Mamba-specific serve flags (--mamba-backend flashinfer
# --mamba-ssm-cache-dtype float16 --enable-mamba-cache-stochastic-rounding
# --mamba-cache-philox-rounds 5). vLLM >= 0.27.1 (repo serves vllm/vllm-openai:v0.28.0).
# Text-only model, no vision flags. Confirm tool+reasoning parsers parse before a real run
# (vLLM tool-parser gotcha; see memory: vllm-tool-parser-gotcha).
model:
  model_kwargs:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 32768
    drop_params: true
    extra_body:
      top_k: 64
      chat_template_kwargs:
        enable_thinking: true