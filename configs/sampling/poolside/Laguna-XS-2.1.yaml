# mini-swe-agent sampling for poolside/Laguna-XS-2.1 (self-hosted vLLM).
#
# Selected automatically by harbor_eval.sh from MODEL: harbor/configs/<repo>.yaml.
# Harbor runs `mini-swe-agent --yolo -c mini -c <this file> ...`; `-c mini` is the
# base scaffold and this file recursive-merges the sampling knobs on top.
#
# Laguna XS 2.1 (33B-A3B MoE, 256 experts) is poolside's agentic coding model with
# INTERLEAVED THINKING. The model card's benchmark sampling: temperature 1.0,
# top_k 20, top_p 1.0, thinking mode ENABLED, context 256K. top_k is not an
# OpenAI-schema param, so it rides in extra_body (drop_params keeps litellm from
# erroring on it). Do NOT set temperature=0 (greedy stalls mini-swe's
# RepeatedFormatError loop; same trap as Qwen/others, see memory: swebench-downstream-eval).
#
# THINKING: enable via default-chat-template-kwargs on the serve side
# ('{"enable_thinking": true}'), matching the card's benchmark config. Reasoning
# returned separately on message.reasoning via --reasoning-parser poolside_v1.
#
# SERVING (serve/models/poolside/Laguna-XS-2.1.json): --tool-call-parser
# poolside_v1 --reasoning-parser poolside_v1 --enable-auto-tool-choice. Requires
# vLLM >= 0.21.0 WITH PR #47311; without that fix, pass --tool-call-parser glm47
# instead (the GLM 4.7 parser) or tool calls silently drop (memory:
# vllm-tool-parser-gotcha). Custom remote code (modeling_laguna.py) -> serve with
# --trust-remote-code. Card-reported SWE-bench Verified 70.9%.
model:
  model_kwargs:
    temperature: 1.0
    top_p: 1.0
    max_tokens: 32768
    drop_params: true
    extra_body:
      top_k: 20