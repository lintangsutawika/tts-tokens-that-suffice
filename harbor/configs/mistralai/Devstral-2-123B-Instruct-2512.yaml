# mini-swe-agent sampling for mistralai/Devstral-2-123B-Instruct-2512 (self-hosted vLLM).
#
# Selected automatically by harbor_eval.sh from MODEL: harbor/configs/<repo>.yaml.
# Harbor runs `mini-swe-agent --yolo -c mini -c <this file> ...`; `-c mini` is the
# base scaffold and this file recursive-merges the sampling knobs on top.
#
# Devstral 2 (123B, ministral3 arch, FP8) is an agentic CODING model, NOT a reasoning
# model -- no thinking/reasoning parser. The model card samples at temperature 0.15
# (top_p unspecified -> 1.0). drop_params keeps litellm from erroring on any
# non-OpenAI-schema param for the openai provider.
#
# SERVING (serve/models/mistralai/Devstral-2-123B-Instruct-2512.json): unlike Small-2505
# this ships BOTH HF (tokenizer.json + chat_template.jinja) and Mistral (tekken.json)
# formats, so it serves in STANDARD HF mode -- the card's vllm command does NOT pass
# --tokenizer-mode mistral. Tool calling still uses --tool-call-parser mistral (the
# Mistral tool format); the wrong parser silently zeroes the eval (memory:
# vllm-tool-parser-gotcha). Card serves at TP=8.
model:
  model_kwargs:
    temperature: 0.15
    top_p: 1.0
    drop_params: true
